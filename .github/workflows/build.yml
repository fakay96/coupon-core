name: Build Docker Images
on:
  workflow_call:
    inputs:
      tag:
        description: 'Image tag to use (pass "latest" to tag production as latest as well)'
        required: false
        type: string
    secrets:
      DOCKER_USERNAME: { required: true }
      DOCKER_PASSWORD: { required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.get_version.outputs.version_tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        run: |
          docker buildx create --use
          docker buildx inspect --bootstrap
      
      - name: Choose image tag
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG=${{ inputs.tag }}
          else
            TAG=$(date +%Y%m%d)-$(echo "${GITHUB_SHA}" | cut -c1-7)
          fi
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "version_tag=$TAG" >> $GITHUB_OUTPUT
      
      - name: Display build tag
        run: 'echo "Building images with tag: ${{ env.VERSION_TAG }}"'
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # ───────── core images ─────────
      - name: Build base image
        run: |
          docker buildx build -f docker/Dockerfile.core \
            --build-arg SERVICE_TYPE=base \
            --label org.opencontainers.image.version=${{ env.VERSION_TAG }} \
            --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t fakay96/coupon-base:${{ env.VERSION_TAG }} \
            --platform linux/amd64 --no-cache --push .
      
      - name: Build backend image
        run: |
          docker buildx build -f docker/Dockerfile.core \
            --build-arg SERVICE_TYPE=backend \
            --cache-from type=registry,ref=fakay96/coupon-base:${{ env.VERSION_TAG }} \
            --label org.opencontainers.image.version=${{ env.VERSION_TAG }} \
            --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t fakay96/coupon-core:${{ env.VERSION_TAG }} \
            --platform linux/amd64 --push .
      
      - name: Build celery image
        run: |
          docker buildx build -f docker/Dockerfile.core \
            --build-arg SERVICE_TYPE=celery \
            --cache-from type=registry,ref=fakay96/coupon-base:${{ env.VERSION_TAG }} \
            --label org.opencontainers.image.version=${{ env.VERSION_TAG }} \
            --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t fakay96/coupon-celery:${{ env.VERSION_TAG }} \
            --platform linux/amd64 --push .
      
     
      
      # ───────── frontend images ─────────
      - name: Build & push STAGING frontend image
        run: |
          docker buildx build -f docker/Dockerfile.frontend \
            --build-arg BUILD_MODE=staging \
            --platform linux/amd64 \
            --cache-to type=registry,ref=fakay96/coupon-frontend:buildcache,mode=max \
            --label org.opencontainers.image.version=${{ env.VERSION_TAG }} \
            --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t fakay96/coupon-frontend-staging:${{ env.VERSION_TAG }} \
            --push .
      
      - name: Build & push PRODUCTION frontend image
        run: |
          docker buildx build -f docker/Dockerfile.frontend \
            --build-arg BUILD_MODE=production \
            --platform linux/amd64 \
            --cache-from type=registry,ref=fakay96/coupon-frontend:buildcache \
            --cache-to type=registry,ref=fakay96/coupon-frontend:buildcache,mode=max \
            --label org.opencontainers.image.version=${{ env.VERSION_TAG }} \
            --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t fakay96/coupon-frontend:${{ env.VERSION_TAG }} \
            --push .
          
          if [ "${{ env.VERSION_TAG }}" = "latest" ]; then
            docker buildx imagetools create \
              -t fakay96/coupon-frontend:latest \
              fakay96/coupon-frontend:${{ env.VERSION_TAG }}
          fi
      
      - name: Prune Docker resources
        run: docker system prune --force --volumes
      
      - name: Save version tag
        run: echo "${{ env.VERSION_TAG }}" > version.txt
      
      - uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt