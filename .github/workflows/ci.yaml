name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Specific version to deploy (optional)'
        required: false
        type: string

env:
  DOCKER_REGISTRY: fakay96
  SERVICES: coupon-core,coupon-celery,coupon-crawler,coupon-inference,coupon-frontend,coupon-frontend-staging

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.get_version.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Choose image tag
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG=${{ inputs.version }}
          else
            TAG=$(date +%Y%m%d)-$(echo "${GITHUB_SHA}" | cut -c1-7)
          fi
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "version_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build base image first
      - name: Build and push base image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.base
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/coupon-base:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION_TAG }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-base:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-base:buildcache,mode=max

      # Build backend services
      - name: Build and push backend services
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.core
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/coupon-core:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-celery:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-crawler:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-inference:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION_TAG }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-base:${{ env.VERSION_TAG }}

      # Build frontend services
      - name: Build and push frontend services
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/coupon-frontend:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-frontend-staging:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION_TAG }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-base:${{ env.VERSION_TAG }}

      - name: Save version metadata
        run: |
          echo "{
            \"version\": \"${{ env.VERSION_TAG }}\",
            \"commit\": \"${{ github.sha }}\",
            \"branch\": \"${{ github.ref }}\",
            \"timestamp\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\",
            \"actor\": \"${{ github.actor }}\",
            \"environment\": \"${{ inputs.environment || 'staging' }}\"
          }" > version-metadata.json

      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: version-metadata
          path: version-metadata.json
          retention-days: 5

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: .
          pattern: version-metadata.json
          merge-multiple: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to Kubernetes
        run: |
          VERSION=$(jq -r '.version' version-metadata.json)
          ENV=$(jq -r '.environment' version-metadata.json)
          
          # Update deployments with new image versions
          for service in ${SERVICES//,/ }; do
            kubectl set image deployment/$service $service=${{ env.DOCKER_REGISTRY }}/$service:$VERSION
          done
          
          # Wait for deployments to roll out
          for service in ${SERVICES//,/ }; do
            kubectl rollout status deployment/$service --timeout=300s
          done

      - name: Verify deployment
        run: |
          for service in ${SERVICES//,/ }; do
            kubectl get pods -l app=$service
            kubectl describe deployment $service
          done

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: .
          pattern: version-metadata.json
          merge-multiple: false

      - name: Send notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Deployment Status
          SLACK_MESSAGE: |
            *Environment:* ${{ inputs.environment || 'staging' }}
            *Version:* $(jq -r '.version' version-metadata.json)
            *Status:* ${{ job.status }}
            *Commit:* $(jq -r '.commit' version-metadata.json)
            *Actor:* $(jq -r '.actor' version-metadata.json)
            *Timestamp:* $(jq -r '.timestamp' version-metadata.json)