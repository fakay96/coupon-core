name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Specific version to deploy (optional)'
        required: false
        type: string

env:
  DOCKER_REGISTRY: fakay96
  SERVICES: coupon-core,coupon-celery,coupon-crawler,coupon-inference,coupon-frontend,coupon-frontend-staging

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.get_version.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Choose image tag
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG=${{ inputs.version }}
          else
            TAG=$(date +%Y%m%d)-$(echo "${GITHUB_SHA}" | cut -c1-7)
          fi
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "version_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/coupon-base:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-core:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-celery:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-crawler:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-inference:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-frontend:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-frontend-staging:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION_TAG }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-base:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-base:buildcache,mode=max

      - name: Save version metadata
        run: |
          echo "{
            \"version\": \"${{ env.VERSION_TAG }}\",
            \"commit\": \"${{ github.sha }}\",
            \"branch\": \"${{ github.ref }}\",
            \"timestamp\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\",
            \"actor\": \"${{ github.actor }}\",
            \"environment\": \"${{ inputs.environment || 'staging' }}\"
          }" > version-metadata.json

      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: version-metadata
          path: version-metadata.json
          retention-days: 5

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: .
          pattern: version-metadata.json
          merge-multiple: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to Kubernetes
        run: |
          VERSION=$(jq -r '.version' version-metadata.json)
          ENV=$(jq -r '.environment' version-metadata.json)
          
          # Update deployments with new image versions
          for service in ${SERVICES//,/ }; do
            kubectl set image deployment/$service $service=${{ env.DOCKER_REGISTRY }}/$service:$VERSION
          done
          
          # Wait for deployments to roll out
          for service in ${SERVICES//,/ }; do
            kubectl rollout status deployment/$service --timeout=300s
          done

      - name: Verify deployment
        run: |
          for service in ${SERVICES//,/ }; do
            kubectl get pods -l app=$service
            kubectl describe deployment $service
          done

  cleanup:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cleanup old images
        run: |
          SERVICES=(${SERVICES//,/ })
          DAYS_TO_KEEP=30
          
          for service in "${SERVICES[@]}"; do
            echo "Cleaning up old images for $service..."
            
            # Get all versions except latest and rollback tags
            VERSIONS=$(docker manifest inspect ${{ env.DOCKER_REGISTRY }}/$service:latest | \
              jq -r '.history[].v1Compatibility | fromjson | .config.Labels["org.opencontainers.image.version"]' | \
              sort -u | grep -v "latest" | grep -v "rollback")
            
            for version in $VERSIONS; do
              # Get image creation date
              CREATED=$(docker manifest inspect ${{ env.DOCKER_REGISTRY }}/$service:$version | \
                jq -r '.history[].v1Compatibility | fromjson | .config.Labels["org.opencontainers.image.created"]')
              
              # Calculate days since creation
              CREATED_EPOCH=$(date -jf "%Y-%m-%dT%H:%M:%SZ" "$CREATED" +%s 2>/dev/null || date -d "$CREATED" +%s)
              CURRENT_EPOCH=$(date +%s)
              DAYS_OLD=$(( ($CURRENT_EPOCH - $CREATED_EPOCH) / 86400 ))
              
              if [ $DAYS_OLD -gt $DAYS_TO_KEEP ]; then
                echo "Removing $service:$version (created $DAYS_OLD days ago)"
                docker manifest rm ${{ env.DOCKER_REGISTRY }}/$service:$version || true
              fi
            done
          done

  notify:
    needs: [build, deploy, cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: .
          pattern: version-metadata.json
          merge-multiple: false

      - name: Send notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Deployment Status
          SLACK_MESSAGE: |
            *Environment:* ${{ inputs.environment || 'staging' }}
            *Version:* $(jq -r '.version' version-metadata.json)
            *Status:* ${{ job.status }}
            *Commit:* $(jq -r '.commit' version-metadata.json)
            *Actor:* $(jq -r '.actor' version-metadata.json)
            *Timestamp:* $(jq -r '.timestamp' version-metadata.json)