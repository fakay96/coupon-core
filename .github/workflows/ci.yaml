name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:


  build:
 
    uses: ./.github/workflows/build.yml
    with:
      tag: ""
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  deploy-staging:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      version_tag: ${{ needs.build.outputs.version_tag }}
      environment: "staging"
    secrets:
      KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
      KUBERNETES_SECRETS: ${{ secrets.KUBERNETES_SECRETS }}

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    with:
      version_tag: ${{ needs.build.outputs.version_tag }}
      environment: "production"
    secrets:
      KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
      KUBERNETES_SECRETS: ${{ secrets.KUBERNETES_SECRETS }}

  notify_failure:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify about failure
        run: |
          echo "CI Pipeline failed. Check logs for more details."
          echo "Test coverage must be at least 90% to proceed with build and deployment."