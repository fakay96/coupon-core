name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'The version tag to deploy (leave blank to auto-generate)'
        required: false
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: staging
        type: choice
        options:
          - staging
          - production
      skip_build:
        description: 'Skip building images (use existing ones)'
        required: false
        default: false
        type: boolean
  
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_REGISTRY: fakay96
  SERVICES: coupon-core,coupon-celery,coupon-frontend,coupon-frontend-staging

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      version_tag: ${{ steps.get_version.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Choose image tag
        id: get_version
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG=${{ inputs.version_tag }}
          else
            TAG=$(date +%Y%m%d)-$(echo "${GITHUB_SHA}" | cut -c1-7)
          fi
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "version_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: ${{ !inputs.skip_build }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build backend services
      - name: Build and push backend services
        if: ${{ !inputs.skip_build }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.core
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/coupon-core:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-celery:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION_TAG }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-core:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-core:buildcache,mode=max

      # Build frontend services
      - name: Build and push frontend services
        if: ${{ !inputs.skip_build }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/coupon-frontend:${{ env.VERSION_TAG }}
            ${{ env.DOCKER_REGISTRY }}/coupon-frontend-staging:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION_TAG }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-frontend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/coupon-frontend:buildcache,mode=max

      - name: Save version metadata
        run: |
          echo "{
            \"version\": \"${{ env.VERSION_TAG }}\",
            \"commit\": \"${{ github.sha }}\",
            \"branch\": \"${{ github.ref }}\",
            \"timestamp\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\",
            \"actor\": \"${{ github.actor }}\",
            \"environment\": \"${{ inputs.environment || (github.ref == 'refs/heads/develop' && 'staging' || 'production') }}\"
          }" > version-metadata.json

      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: version-metadata
          path: version-metadata.json
          retention-days: 5

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/develop' && 'staging' || (github.ref == 'refs/heads/main' && 'production')) }}
    env:
      NAMESPACE: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/develop' && 'staging' || (github.ref == 'refs/heads/main' && 'production')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: ./artifact

      - name: Extract version from metadata
        run: |
          VERSION_TAG=$(jq -r '.version' ./artifact/version-metadata.json)
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "Extracted version tag: $VERSION_TAG"

      - name: Debug artifact contents
        run: |
          echo "=== Artifact directory contents ==="
          ls -la ./artifact/ || echo "Artifact directory not found"
          echo "=== Artifact file contents ==="
          if [ -d "./artifact" ]; then
            for file in ./artifact/*; do
              echo "File: $file"
              if [[ "$file" == *.json ]]; then
                cat "$file" | jq . || echo "Could not parse JSON file $file"
              else
                cat "$file" || echo "Could not read $file"
              fi
              echo "---"
            done
          fi

      - name: Debug input values
        run: |
          echo "NAMESPACE is: $NAMESPACE"
          echo "VERSION_TAG is: $VERSION_TAG"
          echo "Current working directory: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"

      - name: Configure kubectl for DigitalOcean
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify kubeconfig access
        run: kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Namespace
        run: |
          if [ -z "$NAMESPACE" ]; then
            echo "Error: NAMESPACE is not set"
            exit 1
          fi
          if [[ "$NAMESPACE" != "staging" && "$NAMESPACE" != "production" ]]; then
            echo "Error: Invalid NAMESPACE value: $NAMESPACE"
            exit 1
          fi

      - name: Ensure namespace exists
        run: |
          kubectl get namespace $NAMESPACE || kubectl create namespace $NAMESPACE

      - name: Set working directory
        run: |
          echo "Current working directory before change: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          cd $GITHUB_WORKSPACE
          echo "Current working directory after change: $(pwd)"
          echo "Directory contents:"
          ls -la

      - name: Select frontend repo
        run: |
          if [ "$NAMESPACE" = "staging" ]; then
            echo "FRONTEND_REPO=fakay96/coupon-frontend-staging" >> $GITHUB_ENV
          else
            echo "FRONTEND_REPO=fakay96/coupon-frontend" >> $GITHUB_ENV
          fi

      - name: Validate required directories
        run: |
          echo "Validating required k8s directories..."
          echo "Current working directory: $(pwd)"
          
          # Check if k8s directory exists
          if [ ! -d "./k8s" ]; then
            echo "Error: k8s directory not found"
            exit 1
          fi
          
          # Check if backend directory exists
          if [ ! -d "./k8s/backend" ]; then
            echo "Error: k8s/backend directory not found"
            exit 1
          fi
          
          # Check if frontend directory exists
          if [ ! -d "./k8s/frontend" ]; then
            echo "Error: k8s/frontend directory not found"
            exit 1
          fi
          
          # Check if values files exist
          if [ ! -f "./k8s/backend/values/$NAMESPACE-values.yaml" ]; then
            echo "Error: k8s/backend/values/$NAMESPACE-values.yaml not found"
            exit 1
          fi
          
          if [ ! -f "./k8s/frontend/values/$NAMESPACE-values.yaml" ]; then
            echo "Error: k8s/frontend/values/$NAMESPACE-values.yaml not found"
            exit 1
          fi
          
          echo "All required directories and files found!"

      - name: List files for debug
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Root directory contents ==="
          ls -la
          echo "=== k8s directory contents ==="
          ls -la ./k8s || echo "k8s directory not found!"
          echo "=== k8s/backend directory contents ==="
          ls -la ./k8s/backend || echo "k8s/backend directory not found!"
          echo "=== k8s/frontend directory contents ==="
          ls -la ./k8s/frontend || echo "k8s/frontend directory not found!"
          echo "=== Git status ==="
          git status
          echo "=== Git log (last 3 commits) ==="
          git log --oneline -3

      - name: Deploy Backend & Celery
        run: |
          # Try to find the k8s/backend directory
          if [ -d "./k8s/backend" ]; then
            echo "Found k8s/backend directory using relative path"
            HELM_CHART_PATH="./k8s/backend"
          elif [ -d "$GITHUB_WORKSPACE/k8s/backend" ]; then
            echo "Found k8s/backend directory using absolute path"
            HELM_CHART_PATH="$GITHUB_WORKSPACE/k8s/backend"
          else
            echo "Error: k8s/backend directory not found in any expected location"
            echo "Current directory: $(pwd)"
            echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
            ls -la
            exit 1
          fi
          
          # Validate VERSION_TAG is not empty
          if [ -z "$VERSION_TAG" ]; then
            echo "Error: VERSION_TAG is empty"
            exit 1
          fi
          
          echo "Deploying with VERSION_TAG: $VERSION_TAG"
          echo "Using helm chart path: $HELM_CHART_PATH"
          
          helm upgrade --install coupon-service $HELM_CHART_PATH \
            --set backend.image.repository=fakay96/coupon-core \
            --set backend.image.tag=$VERSION_TAG \
            --set celery.image.repository=fakay96/coupon-celery \
            --set celery.image.tag=$VERSION_TAG \
            --namespace $NAMESPACE --create-namespace \
            -f $HELM_CHART_PATH/values/$NAMESPACE-values.yaml \
            --atomic --force --cleanup-on-fail --history-max 5 \
            --timeout 8m0s

      - name: Debug before Frontend deployment
        run: |
          echo "=== Debug before Frontend deployment ==="
          echo "Current directory: $(pwd)"
          echo "=== Root directory contents ==="
          ls -la
          echo "=== k8s directory contents ==="
          ls -la ./k8s || echo "k8s directory not found!"
          echo "=== k8s/frontend directory contents ==="
          ls -la ./k8s/frontend || echo "k8s/frontend directory not found!"
          echo "=== Environment variables ==="
          echo "NAMESPACE: $NAMESPACE"
          echo "VERSION_TAG: $VERSION_TAG"
          echo "FRONTEND_REPO: $FRONTEND_REPO"

      - name: Deploy Frontend
        run: |
          # Validate VERSION_TAG is not empty
          if [ -z "$VERSION_TAG" ]; then
            echo "Error: VERSION_TAG is empty"
            exit 1
          fi
          
          echo "Deploying frontend with VERSION_TAG: $VERSION_TAG"
          
          helm upgrade --install frontend ./k8s/frontend \
            --set frontend.image.repository=$FRONTEND_REPO \
            --set frontend.image.tag=$VERSION_TAG \
            --namespace $NAMESPACE --create-namespace \
            -f ./k8s/frontend/values/$NAMESPACE-values.yaml \
            --atomic --force --cleanup-on-fail --history-max 5 \
            --timeout 5m0s

      - name: Verify service endpoints
        run: |
          kubectl get endpoints coupon-service -n $NAMESPACE || echo "Backend service endpoint not found!"
          kubectl get endpoints frontend -n $NAMESPACE || echo "Frontend service endpoint not found!"

      - name: Debug pod logs on failure
        if: failure()
        run: |
          echo "Fetching logs for failed pods..."
          kubectl logs -l app=backend -n $NAMESPACE || echo "No logs found for backend"
          kubectl logs -l app=frontend -n $NAMESPACE || echo "No logs found for frontend"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back deployments..."
          LAST_BACKEND_REVISION=$(helm history coupon-service -n $NAMESPACE | tail -n 2 | head -n 1 | awk '{print $1}')
          LAST_FRONTEND_REVISION=$(helm history frontend -n $NAMESPACE | tail -n 2 | head -n 1 | awk '{print $1}')
          
          helm rollback coupon-service $LAST_BACKEND_REVISION -n $NAMESPACE || echo "Failed to rollback backend"
          helm rollback frontend $LAST_FRONTEND_REVISION -n $NAMESPACE || echo "Failed to rollback frontend"
