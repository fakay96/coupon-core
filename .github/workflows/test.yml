name: Test and Coverage

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install system dependencies for GeoDjango
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libproj-dev
        echo "GDAL version:"
        gdalinfo --version
        echo "GDAL_LIBRARY_PATH=/usr/lib/libgdal.so" >> $GITHUB_ENV

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-xdist
        pip install -e .

    - name: Run all tests with coverage
      run: |
        pytest tests/unit/ tests/integration/ \
          --cov=discountcrawlers --cov-report=xml --cov-report=term-missing \
          --junitxml=test-results.xml

        COVERAGE=$(python -c "import xml.etree.ElementTree as ET; \
          tree = ET.parse('coverage.xml'); \
          root = tree.getroot(); \
          print(float(root.attrib['line-rate']) * 100)")

        echo "Coverage: $COVERAGE%"
        if python -c "exit(0) if $COVERAGE >= 90 else exit(1)"; then
          echo "✅ Test coverage is sufficient."
        else
          echo "❌ Coverage is below 90%: $COVERAGE%"
          exit 1
        fi

    - name: Install Node dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: frontend
      run: npm run test -- --run

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

    - name: Cache test results
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pytest
          .pytest_cache
        key: ${{ runner.os }}-pytest-${{ hashFiles('**/test_*.py') }}
        restore-keys: |
          ${{ runner.os }}-pytest-

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          coverage.xml
          test-results.xml
          .pytest_cache
        retention-days: 7

    - name: Publish Test Results
      uses: mikepenz/action-junit-report@v3
      with:
        report_paths: '**/test-results.xml'
        fail_on_failure: true
