version: '3.8'

services:
  postgres:
    image: postgis/postgis:13-3.3
    environment:
      POSTGRES_USER: coupon_admin
      POSTGRES_PASSWORD: S3cureP@ssw0rd
      POSTGRES_DB: coupon_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon_admin -d coupon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "redis_password"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Add any other services needed for testing here 