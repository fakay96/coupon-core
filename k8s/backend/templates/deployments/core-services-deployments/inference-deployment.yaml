apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-inference
  namespace: {{ .Release.Namespace }}
  labels:
    app: inference
    component: core-service
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.inference.replicaCount }}
  selector:
    matchLabels:
      app: inference
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: inference
        component: core-service
        release: {{ .Release.Name }}
    spec:
      containers:
      - name: inference
        image: "{{ .Values.inference.image.repository }}:{{ .Values.inference.image.tag }}"
        imagePullPolicy: {{ .Values.inference.image.pullPolicy }}
        env:
        # Redis configuration
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        
        # Logging configuration
        - name: LOG_LEVEL
          value: {{ .Values.inference.logging.level | quote }}
        
        resources:
          {{- toYaml .Values.inference.resources | nindent 12 }}
      
      # Add affinity rules to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - inference
              topologyKey: kubernetes.io/hostname 