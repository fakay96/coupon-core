# Default values for coupon-services
# This is a YAML-formatted file.

namespace: default

ingress:
  host: ""
  enabled: false
  className: "nginx"
  annotations: {}
  tls: []

backend:
  enabled: true
  image:
    repository: fakay96/coupon-core
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  nodeSelector: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 85
  affinity: {}
  env:
    environment: development
    logLevel: info

celery:
  enabled: true
  image:
    repository: fakay96/coupon-celery
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  workerCount: 1
  service:
    type: ClusterIP
    port: 8000
  nodeSelector: {}
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 85

frontend:
  replicaCount: 1
  image:
    repository: fakay96/coupon-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "300m"

redis:
  enabled: true
  replicaCount: 1
  imageTag: "7.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  persistence:
    enabled: true
    size: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

tolerations: []
affinity: {}

inference:
  enabled: false
  image:
    repository: fakay96/coupon-inference
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  replicas: 1
  hpa:
    enabled: false 