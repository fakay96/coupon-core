# Inference service configuration
inference:
  # Image configuration
  image:
    repository: fakay96/coupon-inference
    tag: latest
    pullPolicy: Always
  
  # Replica configuration
  replicaCount: 2
  
  # Resource configuration
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  # Logging configuration
  logging:
    level: "INFO"
  
  # Redis configuration
  redis:
    host: redis
    port: 6379
    db: 0 