namespace: production

ingress:
  host: api.dishpal.ai
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - api.dishpal.ai
      secretName: api-dishpal-ai-tls
backend:
  enabled: true
  image:
    repository: fakay96/coupon-core
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  replicas: 2

  service:
    type: ClusterIP
    port: 8000
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 85

  nodeSelector:
    workload: backend

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload
            operator: In
            values:
            - backend

  env:
    environment: production
    logLevel: debug

celery:
  enabled: true
  image:
    repository: fakay96/coupon-celery
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  workerCount: 2

  service:
    type: ClusterIP
    port: 8000

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 85

  nodeSelector:
    workload: celery

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload
            operator: In
            values:
            - celery

frontend:
  replicaCount: 1

  image:
    repository: fakay96/coupon-frontend
    tag: ""
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      memory: "64Mi"  # Reduced from 192Mi → 64Mi
      cpu: "50m"  # Reduced from 150m → 50m
    limits:
      memory: "384Mi"
      cpu: "300m"

redis:
  enabled: true
  replicaCount: 1
  imageTag: "7.0"

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  persistence:
    enabled: true
    size: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

tolerations: []

inference:
  enabled: true
  image:
    repository: fakay96/coupon-inference
    pullPolicy: Always
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
