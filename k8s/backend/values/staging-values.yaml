namespace: staging

ingress:
  host: api-staging.dishpal.ai
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    cert-manager.io/cluster-issuer: letsencrypt-staging
  tls:
    - hosts:
        - api-staging.dishpal.ai
      secretName: api-staging-dishpal-ai-tls

backend:
  replicaCount: 1

  image:
    repository: fakay96/backend  
    tag: ""
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  nodeSelector:
    workload: backend

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload
            operator: In
            values:
            - backend
  env:
    environment: staging
    logLevel: debug

celery:
  replicaCount: 2

  image:
    repository: fakay96/coupon-celery
    tag: ""
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  nodeSelector:
    workload: celery

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload
            operator: In
            values:
            - celery
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3  
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 85

redis:
  enabled: true
  replicaCount: 1
  imageTag: "7.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  persistence:
    enabled: true
    size: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 40
  targetMemoryUtilizationPercentage: 80

  

tolerations: []

affinity: {}
