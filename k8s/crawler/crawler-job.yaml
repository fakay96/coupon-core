apiVersion: crawler.fakay96.com/v1
kind: CrawlerJob
metadata:
  name: discount-crawler
  namespace: {{ .Release.Namespace }}
spec:
  spiders:
    - name: penny
      resourceMultiplier: 1.0
    - name: zalando
      resourceMultiplier: 1.2
  baseResources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: discount-crawler
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      serviceAccountName: crawler
      containers:
      - name: crawler
        image: fakay96/discount-crawler:latest
        env:
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: host
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: SPACES_KEY
          valueFrom:
            secretKeyRef:
              name: spaces-credentials
              key: key
        - name: SPACES_SECRET
          valueFrom:
            secretKeyRef:
              name: spaces-credentials
              key: secret
        - name: SPACES_REGION
          valueFrom:
            secretKeyRef:
              name: spaces-credentials
              key: region
        - name: SPACES_BUCKET
          valueFrom:
            secretKeyRef:
              name: spaces-credentials
              key: bucket
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: crawler-logs
          mountPath: /app/logs
      volumes:
      - name: crawler-logs
        persistentVolumeClaim:
          claimName: crawler-logs-pvc
      restartPolicy: Never 