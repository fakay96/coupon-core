apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crawlerjobs.crawler.fakay96.com
spec:
  group: crawler.fakay96.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                spiders:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      resourceMultiplier:
                        type: number
                baseResources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
  scope: Namespaced
  names:
    plural: crawlerjobs
    singular: crawlerjob
    kind: CrawlerJob
    shortNames:
      - cj
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-resource-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler-resource-operator
  template:
    metadata:
      labels:
        app: crawler-resource-operator
    spec:
      serviceAccountName: crawler-operator
      containers:
      - name: operator
        image: fakay96/crawler-resource-operator:latest
        env:
        - name: WATCH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m" 