[pytest]
DJANGO_SETTINGS_MODULE = coupon_core.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --cov=authentication --cov=geodiscounts
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=90
    --verbose
    --tb=short
    --strict-markers
markers =
    django_db: Mark the test as requiring database access
    integration: Mark the test as an integration test
    unit: Mark the test as a unit test

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function 